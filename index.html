<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP RED STREAM - Luxury Subtitles & Movies</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Font icons සඳහා -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <!-- Top Luxury Header -->
    <header class="luxury-header">
        <div class="logo">VIP<span>STREAM</span></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search Anime, Movie, Donghua...">
            <button onclick="searchMedia()"><i class="fas fa-search"></i></button>
        </div>
    </header>

    <!-- Main Content Video & Subtitle Display -->
    <main class="container">
        <div id="results" class="movie-grid">
            <!-- API එකෙන් එන ප්‍රතිඵල මෙතන පෙනේවි -->
            <p class="initial-text">ලෝකයේ ඕනෑම ඇනිමේ හෝ චිත්‍රපටයක නමක් ඉහත සර්ච් කරන්න.</p>
        </div>
    </main>

    <!-- Mobile Navigation Bar (Bottom) -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="#" class="nav-item"><i class="fas fa-fire"></i><span>Trending</span></a>
        <a href="#" class="nav-item"><i class="fas fa-download"></i><span>Subs</span></a>
        <a href="#" class="nav-item"><i class="fas fa-user-crown"></i><span>VIP</span></a>
    </nav>

    <script src="script.js"></script>
</body>
</html>
